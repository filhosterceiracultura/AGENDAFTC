name: Publicar Agenda FTC

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar agenda
        run: |
          mkdir -p site
          unzip -q AGENDA_V6.zip -d pacote
          cp -R pacote/AGENDA_SEMANAL_MARCA_FTC/. site/
          cp site/Agenda_Semanal_Marca_FTC.html site/index.html

      - name: Configurar publicação
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar agenda
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
